# Fleet configuration for spec 025 (research R9). Every pool's configuration lives here and is
# applied from here; nothing on a node is hand-edited (FR-030, FR-032).
[defaults]
inventory = inventories/staging
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False
forks = 10

[ssh_connection]
pipelining = True
