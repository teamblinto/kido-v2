---
# Staging (spec 025 · T052 · research R9 · architecture § 01).
#
# One node per pool, "except data, which needs its three voters". The spec's assumption says
# staging is one node per pool; R6's quorum requirement overrides it for the data pool alone,
# because a one-voter OpenBao proves nothing about the property SC-009 measures. This is the
# one place staging is bigger than one-of-everything, and it is cheap — the witness is
# 2 vCPU / 4 GB.
#
# Staging is otherwise identical in shape to production: the same pools, the same plays, the
# same WireGuard mesh, the same rule about what may not run on gateway and sandboxd nodes.
# Production differs in counts, not in kind, so its inventory is this file with more hosts.
#
#   app      1   app.yml       Caddy + forge-app(api) + forge-app(agent,events,cron)
#   data     3   data.yml      Postgres, PgBouncer, Redis, OpenBao — THREE Raft voters
#   gateway  1   gateway.yml   forge-gateway only, credential-free
#   sandboxd 1   sandboxd.yml  sandboxd and the sandboxes it runs (spec 042; replaced Daytona)
#   ops      1   ops.yml       Prometheus, Loki, Tempo, Grafana, Alertmanager, CI runner
#
# Every host name here is its WireGuard mesh name. No node is addressed by public IP, and no
# pool reaches another except along the edges § 01 permits.

all:
  vars:
    forge_environment: staging
    forge_internal_domain: staging.forge.internal
    # Deployed sites (spec 027 R10). Read by the app pool (SITE_DOMAIN, to hand out addresses) and
    # the gateway pool (SITE_DOMAIN, to serve them), so it is set once here, where both see it. A
    # domain, not a credential.
    forge_site_domain: staging.forge-sites.dev

  children:
    app:
      hosts:
        app-1:
          ansible_host: app-1.staging.forge.internal

    # Three voters, and the third is the witness. Removing it leaves a quorum of two, which
    # data.yml refuses to configure — see its first two tasks (§ 01, FR-019).
    data:
      hosts:
        data-1:
          ansible_host: data-1.staging.forge.internal
          openbao_internal_name: data-1.staging.forge.internal
          openbao_raft_role: voter
          postgres_role: primary
        data-2:
          ansible_host: data-2.staging.forge.internal
          openbao_internal_name: data-2.staging.forge.internal
          openbao_raft_role: voter
          postgres_role: synchronous_standby
        # Holds no data and votes. § 01: "The third data-plane node exists for that vote; it
        # can be small, because it stores nothing."
        data-witness:
          ansible_host: data-witness.staging.forge.internal
          openbao_internal_name: data-witness.staging.forge.internal
          openbao_raft_role: witness
          postgres_role: none

    gateway:
      hosts:
        gateway-1:
          ansible_host: gateway-1.staging.forge.internal

    sandboxd:
      hosts:
        sandboxd-1:
          ansible_host: sandboxd-1.staging.forge.internal
          # `sandboxd_listen_ip` (this host's WireGuard mesh address; sandboxd listens there and
          # nowhere else) is deliberately NOT set here: sandboxd.yml refuses to run without it.
          # The BAIOS API host that agent homes and the proxy may reach.
          sandboxd_api_host: app-1.staging.forge.internal

    ops:
      hosts:
        ops-1:
          ansible_host: ops-1.staging.forge.internal
