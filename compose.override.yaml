# Local-only (Docker Desktop on Windows/macOS): lets the containerised worker run real agents.
# Values come from the git-ignored root .env. sandboxd (spec 042) replaces Daytona; there is no
# separate Compose project to bootstrap any more.
#
# What differs from compose.yaml, and why: Docker Desktop has no host network or iptables the
# stack can use, so sandboxd runs on the default compose network, publishes its ports on loopback
# for tests run from the host, skips the firewall (sandboxes are NOT isolated: local dev only) and
# uses runc, since gVisor is not installed there. The key is a local-only value, not a secret.
#
# AGENT HOMES DO NOT WORK IN THIS STACK. A home sits on `sbx-agent`, an internal bridge with
# inter-container traffic off, whose only way out is sandboxd's egress proxy on the bridge gateway
# (172.30.0.1). That address lives in Docker Desktop's VM, where sandboxd cannot listen without
# host networking, and attaching sandboxd to sbx-agent instead does not help: with icc off the
# bridge drops home -> sandboxd like any other container-to-container packet (checked on Docker
# Desktop 29.x). SANDBOXD_EGRESS_LISTEN below only gives the proxy something to bind. Use a Linux
# host (infra/sandboxd/README.md) for agent homes; project sandboxes, the toolbox and the real
# suites other than preview-real work here.
services:
  sandboxd:
    environment:
      SANDBOXD_API_KEY: ${DAYTONA_API_KEY:-local-sandboxd-dev-key}
      SANDBOXD_API_KEY_FILE: !reset null
      SANDBOXD_DOCKER_ROOT: /
      SANDBOXD_EGRESS_LISTEN: 0.0.0.0:3988
      SANDBOXD_FIREWALL: 'off'
      SANDBOXD_LISTEN: 0.0.0.0:3986
      SANDBOXD_PREVIEW_LISTEN: 0.0.0.0:3987
      SANDBOXD_PREVIEW_PUBLIC_URL: http://127.0.0.1:3987
      # Tests run from the host need http://127.0.0.1:3986 here; the containerised worker needs this.
      SANDBOXD_PUBLIC_URL: ${SANDBOXD_PUBLIC_URL:-http://sandboxd:3986}
      SANDBOXD_REAL: '0'
      SANDBOXD_RUNTIME_PROJECT: runc
      SANDBOXD_STORAGE_QUOTA: '0'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3986/healthz']
    network_mode: !reset null
    ports:
      - '127.0.0.1:3986:3986'
      - '127.0.0.1:3987:3987'
    secrets: !reset []
  worker:
    environment: &local-sandboxd
      DAYTONA_API_URL: http://sandboxd:3986
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-local-sandboxd-dev-key}
      DAYTONA_API_KEY_FILE: !reset null
    secrets: !reset []
  # No model key: platform credits are retired, so a run is paid by an organisation's API key
  # (Settings) or a person's own subscription. The sandboxd URL and key: the api's preview route
  # broker asks sandboxd for each route's upstream.
  api:
    environment: *local-sandboxd
