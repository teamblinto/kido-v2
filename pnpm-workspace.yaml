  rxjs: 7.8.2
  supertest: 7.2.2
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  tsup: 8.5.1
  turbo: 2.10.9
  tw-animate-css: 1.4.0
  typescript: 5.9.3
  typescript-eslint: 8.67.0
  vite: 8.2.1
  vitest: 4.1.10
