# The single-VPS overlay. Select it in the server's .env (which also stops compose from loading the
# local-dev compose.override.yaml):
#
#   COMPOSE_FILE=compose.yaml:compose.vps.yaml
#
# THIS IS A DEPLOY_ENV=local-GRADE DEPLOYMENT, NOT A HARDENED ONE (see infra/sandboxd/README.md):
# the app still runs with DEPLOY_ENV=local, the KEK is the env provider with a master key held in
# .env on this host (OpenBao's dev server would lose its keys, and with them every tenant secret,
# on each restart), Postgres and Redis use the repository's fixed passwords/no auth (but are no
# longer published), the gateway uses the plain broker, and there is no object store. What the
# overlay does fix is exposure: only Caddy (80/443) is published, with TLS, and previews are served
# through the gateway. A hardened deployment is the Ansible path (infra/ansible).
#
# Required in .env: APP_HOST, HOOKS_HOST, PREVIEW_DOMAIN, PREVIEW_SIGNING_KEY,
# PREVIEW_SIGNING_KEY_ID, PREVIEW_PUBLIC_JWKS, AGENT_HOME_CLAUDE_VERSION, KEK_ENV_MASTER_KEY,
# BROKER_SHARED_SECRET, GITHUB_WEBHOOK_SECRET (how to make them: infra/sandboxd/README.md).
#
# Images: FORGE_APP_IMAGE, FORGE_GATEWAY_IMAGE and FORGE_SANDBOXD_IMAGE name what runs. Unset, they
# are the local names the base file's `build:` produces (`docker compose build`, a first bring-up
# with no registry); a CD deploy pins them to release.yml's GHCR digests in a release.env
# (infra/sandboxd/deploy-vps.sh).
services:
  # Nothing but the edge is reachable from outside: drop every published store port.
  postgres:
    ports: !reset []
  redis-session:
    ports: !reset []
  redis-cache:
    ports: !reset []
  redis-queue:
    ports: !reset []
  redis-stream:
    ports: !reset []
  # Not used here (KEK_PROVIDER=env below): behind a profile nobody enables, so `up` never starts it.
  openbao:
    profiles: [unused-on-vps]

  # The agent-home egress proxy lets homes reach exactly this host (plus Anthropic's): the api the
  # runner calls is AGENT_HOME_SERVER_URL below, https://APP_HOST.
  sandboxd:
    image: ${FORGE_SANDBOXD_IMAGE:-forge-sandboxd}
    environment:
      SANDBOXD_API_HOST: ${APP_HOST:?set APP_HOST in .env}

  caddy:
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:9123/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in .env}
      HOOKS_HOST: ${HOOKS_HOST:?set HOOKS_HOST in .env}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:?set PREVIEW_DOMAIN in .env}
    # Caddy does TLS (Let's Encrypt), so 80 and 443 (and 443/udp for HTTP/3), not 8080.
    ports: !override
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      # Other sites this host serves through this edge (infra/Caddyfile.vps, last line). It lives
      # outside the release directories, so a deploy never drops them.
      - /etc/kido/caddy-sites.d:/etc/caddy/sites.d:ro
      - ./apps/web/dist:/srv:ro
      - caddy-data:/data

  # The schema migration, run once on every `docker compose up` before the api starts: the api
  # image runs none, and Postgres is unpublished here, so `pnpm db:migrate` from the host cannot
  # reach it. It is the image's own drizzle-orm migrator over the image's own migrations (the same
  # program as infra/deploy.sh step 3, minus the advisory lock: one host, one migrate container).
  migrate:
    image: ${FORGE_APP_IMAGE:-forge-app}
    # The api service's image (built by its `build:` or pulled for it); never pulled on its own.
    pull_policy: never
    command:
      - node
      - --input-type=module
      - --eval
      - |
        import { drizzle } from 'drizzle-orm/node-postgres';
        import { migrate } from 'drizzle-orm/node-postgres/migrator';
        import pg from 'pg';
        const client = new pg.Client({ connectionString: process.env.DATABASE_MIGRATION_URL });
        await client.connect();
        await migrate(drizzle(client), { migrationsFolder: '/app/node_modules/@repo/db/migrations' });
        await client.end();
        console.log('migrations applied');
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: postgres://forge_migrator:forge_migrator@postgres:5432/forge
    restart: 'no'

  # depends_on is replaced, not merged: the base file's list names openbao, which is off here.
  api:
    image: ${FORGE_APP_IMAGE:-forge-app}
    # Optional sign-in providers (GOOGLE_OAUTH_CLIENT_ID/_SECRET, GITHUB_OAUTH_*), only in the api
    # (the OAuth controller). A file, not `${VAR:-}` here: an empty value fails the schema's
    # min(1), so only variables the file actually sets reach the api. Absent file: no providers.
    # github.env: the GitHub App connector (GITHUB_APP_*), in the api and the worker alike (the
    # worker's push consumer mints installation tokens too). Absent file: no connector.
    env_file:
      - path: ${KIDO_ROOT:-/opt/kido}/oauth.env
        required: false
      - path: ${KIDO_ROOT:-/opt/kido}/github.env
        required: false
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-stream:
        condition: service_healthy
    # AGENT_HOME_CLAUDE_VERSION: an exact Claude Code version, never `stable`: what runs is what
    # we chose. AGENT_HOME_SERVER_URL: the api as a home's runner reaches it, through the
    # egress proxy and Caddy (DEPLOY_ENV=local would default it to host.docker.internal:3000,
    # which the proxy refuses). DAYTONA_*: the preview broker in this process asks sandboxd for
    # each route's signed upstream, so the api needs sandboxd and its key too (read like the
    # worker reads it). KEK_*: the env provider; the key is generated once and must never change
    # (every tenant data key is wrapped with it).
    environment: &vps-app-env
      AGENT_HOME_CLAUDE_VERSION: ${AGENT_HOME_CLAUDE_VERSION:?pin an exact x.y.z in .env}
      AGENT_HOME_SERVER_URL: https://${APP_HOST:?}
      # The plain broker's bearer (api <-> gateway on the shared loopback); its fallback is a
      # well-known local value, so the overlay requires a generated one.
      BROKER_SHARED_SECRET: ${BROKER_SHARED_SECRET:?generate once with openssl rand -hex 32}
      APP_URL: https://${APP_HOST:?}
      CORS_ORIGINS: https://${APP_HOST:?}
      DAYTONA_API_KEY_FILE: /run/secrets/sandboxd_api_key
      DAYTONA_API_URL: http://172.30.2.1:3986
      # The base file's value is the published example; DEPLOY_ENV=local would accept it, and with
      # it anyone's signature on a push delivery. Here, in `environment`, because env_file loses to it.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?generate once with openssl rand -hex 32}
      HOOKS_HOST: ${HOOKS_HOST:?}
      KEK_ENV_MASTER_KEY: ${KEK_ENV_MASTER_KEY:?generate once with openssl rand -base64 32}
      KEK_PROVIDER: env
      # This host has no bucket: the repository mirrors, the only copy of a project's files that
      # outlives its sandbox, live on the repo-mirrors volume. Back it up with Postgres. Built
      # releases live there too (artifacts/), written by the worker's build and read by its Netlify
      # publish; the gateway serves platform-hosted sites from a bucket only, so none here.
      OBJECT_STORE_DIR: /var/lib/forge/repos
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:?}
      PREVIEW_SIGNING_KEY: ${PREVIEW_SIGNING_KEY:?}
      PREVIEW_SIGNING_KEY_ID: ${PREVIEW_SIGNING_KEY_ID:?}
      # A project sandbox reaches this through the host's public address (Docker DNATs it to the
      # edge); firewall.sh accepts exactly that path (SBX_HOST_ALLOW_TCP).
      SANDBOX_CALLBACK_URL: https://${APP_HOST:?}/api/v1/internal/sandbox-callbacks
    # The key file is 0640 to host gid <dockremap subgid base>+3986 (host-setup.sh), as for the
    # worker.
    group_add: ['3986']
    # The gateway shares this container's network namespace, so it reaches the plain broker
    # (127.0.0.1:3001) and sandboxd's preview listener on sbx-ctl through this container.
    networks: [default, sbx-ctl]
    secrets:
      - sandboxd_api_key
    volumes:
      - repo-mirrors:/var/lib/forge/repos

  worker:
    image: ${FORGE_APP_IMAGE:-forge-app}
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-session:
        condition: service_healthy
      redis-stream:
        condition: service_healthy
    env_file:
      - path: ${KIDO_ROOT:-/opt/kido}/github.env
        required: false
    environment:
      <<: *vps-app-env
    volumes:
      - repo-mirrors:/var/lib/forge/repos

  # The preview gateway (spec 017): verifies a signed route record and proxies to the sandbox
  # through sandboxd's preview listener. Local-grade wiring: network_mode service:api puts it
  # where the api's loopback-only plain broker is, so no mTLS material is needed; the hardened
  # path is infra/ansible/gateway.yml (mTLS broker). The price: the gateway shares the api's
  # network namespace, so it can reach everything the api can (the stores, the plain broker,
  # sandboxd's control port), and a gateway compromise is a compromise of that namespace.
  #
  # When the api container is recreated or restarts, the gateway is left in the old, dead
  # namespace. `restart: true` restarts it on compose-driven api restarts; kido-deploy recreates it
  # on every deploy (`activate`); any other api restart (a crash, `docker restart`) is caught by
  # GATEWAY_WATCHDOG_URL: 30 s with no answer from the api on the shared loopback (after a 60 s
  # start period) and the gateway exits 1, so `restart: unless-stopped` starts it again, which
  # joins the api's current namespace (a `container:` mode is resolved at each start). Docker
  # tries that start once: if the api is not running at that moment (crash-looping), the gateway
  # stays exited until `docker compose up -d gateway` or the next deploy.
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    image: ${FORGE_GATEWAY_IMAGE:-forge-gateway}
    depends_on:
      api:
        condition: service_healthy
        restart: true
    environment:
      BROKER_HOST: 127.0.0.1
      BROKER_SHARED_SECRET: ${BROKER_SHARED_SECRET:?}
      BROKER_TRANSPORT: plain
      DEPLOY_ENV: local
      # The same probe as the healthcheck below, which only reports (apps/gateway/src/watchdog.ts).
      GATEWAY_WATCHDOG_URL: http://127.0.0.1:3000/api/v1/health
      PORT: 3200
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:?}
      PREVIEW_PUBLIC_JWKS: ${PREVIEW_PUBLIC_JWKS:?}
      # The route's upstream host does not resolve from here; dial sandboxd's preview listener on
      # sbx-ctl and keep the minted Host, exactly as the preview-real suite does.
      PREVIEW_UPSTREAM_DIAL: http://172.30.2.1:3987
      PRODUCT_ORIGIN: https://${APP_HOST:?}
      # Caddy's on-demand TLS `ask` (infra/Caddyfile.vps), reached as api:3201; never proxied.
      TLS_ASK_PORT: 3201
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:3000/api/v1/health'), fetch('http://127.0.0.1:3201/')]).then(([api]) => process.exit(api.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    network_mode: service:api
    restart: unless-stopped

volumes:
  caddy-data:
  repo-mirrors:
